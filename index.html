<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Входящие заявки</title>
  <style>
    body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui, sans-serif; }
    textarea { box-sizing: border-box; display: block; width: 100%; margin: .5rem 0; padding: .5rem; font: inherit; }
    button { padding: .4rem .8rem; font: inherit; }
    pre { white-space: pre-wrap; }
    #draft { min-height: 4rem; }
    #feedback { min-height: 1.5rem; }
    [aria-invalid="true"] { border: 2px solid #a12622; }
  </style>
</head>
<body>
  <h1>Входящие заявки</h1>
  <form>
    <label for="message">Текст заявки</label>
    <textarea id="message" rows="4" aria-describedby="feedback"></textarea>
    <button type="submit">Разобрать заявку</button>
  </form>
  <p id="feedback" role="status" aria-live="polite"></p>
  <section id="result" aria-busy="false" aria-label="Результат разбора">
    <p>Тема: <strong id="topic">—</strong></p>
    <label for="draft">Черновик ответа</label>
    <textarea id="draft" rows="5" placeholder="При ручном разборе напишите ответ здесь"></textarea>
    <p>Проверьте тему и текст перед отправкой клиенту. Страница ничего не отправляет автоматически.</p>
  </section>
  <script type="module" src="/app.mjs"></script>
</body>
</html>
